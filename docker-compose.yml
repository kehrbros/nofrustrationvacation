# Docker Swarm stack of Nfv (PostgreSQL, backend, frontend and Caddy as TLS proxy), see Docs/deployment.md.
#
#   docker compose build                                  # optional, builds the images locally
#   docker stack deploy -c docker-compose.yml nfv
#
# The secrets are external and must be created with "docker secret create" before the first deployment.
# "docker stack deploy" does not read .env files, variables come from the shell (see .env.example).

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/kehrbros/vacantagent/backend:main}
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nfv
      POSTGRES_USER: nfv
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      # Public URLs as seen by the browser: issuer of the IdP, redirect URIs, CORS and PayPal return URLs.
      # Frontend and backend share the origin https://DOMAIN, Caddy routes by path (deploy/caddy/Caddyfile)
      NFV_BACKEND_URL: https://${DOMAIN:?DOMAIN must be set, see Docs/deployment.md}
      NFV_FRONTEND_URL: https://${DOMAIN:?DOMAIN must be set, see Docs/deployment.md}
      # Trust X-Forwarded-Proto/-For of Caddy (private addresses only), so redirects (e.g. to /login) stay https
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # Road network data mounted below, see Docs/network.md#konfiguration
      NFV_DATA_DIR: /data
    # Host directory NFV_HOST_DATA_DIR (required, e.g. /home/deploy/data), must exist on the node:
    # mkdir -p /home/deploy/data/osm /home/deploy/data/graphs
    volumes:
      # OSM extract copied by hand to the host (not in Git)
      - type: bind
        source: ${NFV_HOST_DATA_DIR:?NFV_HOST_DATA_DIR must be set, see Docs/deployment.md}/osm
        target: /data/osm
        read_only: true
      # GraphHopper graph built on the first start
      - type: bind
        source: ${NFV_HOST_DATA_DIR:?NFV_HOST_DATA_DIR must be set, see Docs/deployment.md}/graphs
        target: /data/graphs
    # Mounted as files /run/secrets/<target>, Spring reads them via spring.config.import=configtree:/run/secrets/
    # and resolves the placeholders ${PAYPAL_CLIENT_ID} etc. in application.properties
    secrets:
      - source: paypal_client_id
        target: PAYPAL_CLIENT_ID
      - source: paypal_client_secret
        target: PAYPAL_CLIENT_SECRET
      - source: idp_signing_key
        target: NFV_IDP_SIGNING_KEY
      - source: postgres_password
        target: POSTGRES_PASSWORD
      - source: openai_api_key
        target: OPENAI_API_KEY
      - source: liteapi_api_key
        target: LITEAPI_API_KEY
    networks:
      - nfv
    deploy:
      replicas: 1
      # Bind mounts are local to a node, run on the node that holds NFV_HOST_DATA_DIR
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
        failure_action: rollback
      # Swarm ignores depends_on, the backend restarts until PostgreSQL accepts connections
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          # Import of the NZ extract needs a few GB
          memory: 4G

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: nfv
      POSTGRES_USER: nfv
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nfv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfv -d nfv"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      # The volume is local to a node, keep the database on the node that holds its data
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M

  # TLS terminating reverse proxy, the only service with published ports, see Docs/deployment.md#tls-caddy
  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/kehrbros/vacantagent/caddy:main}
    build:
      context: ./deploy/caddy
    environment:
      # Domain of the app, Caddy requests the Let's Encrypt certificate for it
      DOMAIN: ${DOMAIN:?DOMAIN must be set, see Docs/deployment.md}
    # Host mode: ports bound directly on the node, keeps the real client IP (the ingress network would replace it)
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    volumes:
      # Certificates and ACME account, keep them to stay below the Let's Encrypt rate limits
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - nfv
    deploy:
      replicas: 1
      # Host ports and the certificate volume are local to a node
      placement:
        constraints:
          - node.role == manager
      update_config:
        # Host ports cannot be bound twice
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 128M

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/kehrbros/vacantagent/frontend:main}
    build:
      context: ./frontend
      args:
        # Build time only (Vite): the IdP is the backend under the origin of the page (Caddy), see src/auth/oidcConfig.ts
        VITE_OIDC_AUTHORITY: same-origin
    environment:
      # nginx forwards /api/** to this upstream, see frontend/nginx.conf
      BACKEND_UPSTREAM: http://backend:8080
    networks:
      - nfv
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 128M

networks:
  nfv:
    driver: overlay

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  paypal_client_id:
    external: true
    name: nfv_paypal_client_id
  paypal_client_secret:
    external: true
    name: nfv_paypal_client_secret
  idp_signing_key:
    external: true
    name: nfv_idp_signing_key
  postgres_password:
    external: true
    name: nfv_postgres_password
  openai_api_key:
    external: true
    name: nfv_openai_api_key
  liteapi_api_key:
    external: true
    name: nfv_liteapi_api_key
