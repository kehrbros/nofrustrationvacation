# Loaded in addition to src/main/resources/application.properties and overrides it.
# Tests use a fresh PostGIS container (Testcontainers, needs Docker), shared by all Spring contexts of one test run,
# never the database of the running app.
spring.datasource.url=jdbc:tc:postgis:17-3.5-alpine:///vacantagent
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
# Tests must not fetch exchange rates from the ECB.
vacantagent.money.exchange-rates.update-enabled=false
# Tests must not call PayPal: no credentials (except where a test sets them) and no status polling.
vacantagent.paypal.client-id=
vacantagent.paypal.client-secret=
vacantagent.accounting.status-check-enabled=false
