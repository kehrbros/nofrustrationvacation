# Loaded in addition to src/main/resources/application.properties and overrides it.
# Tests use a fresh PostGIS container (Testcontainers, needs Docker), shared by all Spring contexts of one test run,
# never the database of the running app.
spring.datasource.url=jdbc:tc:postgis:17-3.5-alpine:///nfv
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
# Every Spring context cached during a test run keeps its own pool, all on one database (limit 100 connections)
spring.datasource.hikari.maximum-pool-size=5
# Tests must not fetch exchange rates from the ECB.
nfv.money.exchange-rates.update-enabled=false
# Tests must not call PayPal: no credentials (except where a test sets them) and no status polling.
nfv.paypal.client-id=
nfv.paypal.client-secret=
nfv.accounting.status-check-enabled=false
# Road network: central Wellington, imported by the tests that need it, not on every context start
nfv.network.import-on-start=false
nfv.network.regions.wellington.osm-file=src/test/resources/osm/wellington.osm.gz
nfv.network.regions.wellington.graph-dir=target/graphs/wellington
nfv.network.regions.wellington.data-access=RAM_STORE
nfv.network.regions.wellington.driving-side=LEFT
nfv.network.regions.wellington.ferries=true
# Traffic sources: never the real NZTA, no scheduler, tests call TrafficPolling.pollNow("nz-nzta")
nfv.input.sources.nz-nzta.enabled=true
nfv.input.sources.nz-nzta.url=classpath:sources/nz-nzta/events.json
nfv.input.sources.nz-nzta.network-region=wellington
nfv.input.polling.scheduler-enabled=false
# no processing in the background, tests call TrafficEventProcessor.processPending()
nfv.input.processing.after-poll=false
# Tests must not call OpenAI, even if OPENAI_API_KEY is set on the machine
nfv.assistant.api-key=
# No runs of the agent in the background, they would race with every test that ends in TOO_LATE
nfv.advisor.auto-enabled=false
# Tests must not call LiteAPI, even if LITEAPI_API_KEY is set on the machine
nfv.bookings.alternatives.api-key=
# no background completion of reservations, tests call ReservationRecovery.runOnce()
nfv.bookings.alternatives.recovery-enabled=false
