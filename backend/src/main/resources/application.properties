# Docker secrets (files in /run/secrets, e.g. PAYPAL_CLIENT_ID) become properties named like the file and resolve the
# placeholders below, see Docs/deployment.md. Optional, locally environment variables are used.
spring.config.import=optional:configtree:/run/secrets/

# Public URLs as seen by the browser, used for issuer, redirect URIs, CORS and PayPal return URLs
vacantagent.backend-url=${VACANTAGENT_BACKEND_URL:http://localhost:8080}
# URL of the former web frontend, only used by the PayPal return URLs (legacy, see Docs/architecture.md) and CORS
vacantagent.frontend-url=${VACANTAGENT_FRONTEND_URL:http://localhost:5173}

spring.datasource.url=jdbc:h2:file:./data/vacantagent;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.revision_field_name=rev
spring.jpa.properties.hibernate.envers.revision_type_field_name=revtype

# Resource server (API), see Docs/authentication.md. For Keycloak: issuer-uri=https://<host>/realms/<realm>,
# username-claim=preferred_username, roles-claim=realm_access.roles
spring.security.oauth2.resourceserver.jwt.issuer-uri=${vacantagent.backend-url}
vacantagent.security.username-claim=sub
vacantagent.security.roles-claim=roles

# Auth module (own identity provider, package com.vacantagent.auth). Remove when switching to an external IdP.
spring.security.oauth2.authorizationserver.issuer=${vacantagent.backend-url}
# Mobile app (frontend/, React Native): public client with PKCE, redirect via the private-use URI scheme of the app
# (RFC 8252). Refresh tokens with rotation keep the user logged in, see Docs/authentication.md.
spring.security.oauth2.authorizationserver.client.vacantagent-app.registration.client-id=vacantagent-app
spring.security.oauth2.authorizationserver.client.vacantagent-app.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.vacantagent-app.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.vacantagent-app.registration.redirect-uris=vacantagent://auth/callback
spring.security.oauth2.authorizationserver.client.vacantagent-app.registration.post-logout-redirect-uris=vacantagent://auth/logout
spring.security.oauth2.authorizationserver.client.vacantagent-app.registration.scopes=openid,profile,email
spring.security.oauth2.authorizationserver.client.vacantagent-app.require-proof-key=true
spring.security.oauth2.authorizationserver.client.vacantagent-app.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.vacantagent-app.token.access-token-time-to-live=15m
spring.security.oauth2.authorizationserver.client.vacantagent-app.token.refresh-token-time-to-live=30d
spring.security.oauth2.authorizationserver.client.vacantagent-app.token.reuse-refresh-tokens=false
# Swagger UI of the backend
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.registration.client-id=vacantagent-swagger
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.registration.redirect-uris=${vacantagent.backend-url}/swagger-ui/oauth2-redirect.html
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.registration.scopes=openid,profile,email
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.require-proof-key=true
spring.security.oauth2.authorizationserver.client.vacantagent-swagger.require-authorization-consent=false
vacantagent.auth.cors.allowed-origins=${vacantagent.frontend-url}
# Creates the account test/test on startup if no account exists
vacantagent.auth.test-account.enabled=true
# Key signing the tokens: PEM encoded PKCS#8 RSA private key (Docker secret VACANTAGENT_IDP_SIGNING_KEY, see
# Docs/deployment.md). Without it a temporary key is used, all tokens become invalid on restart.
vacantagent.auth.signing-key=${VACANTAGENT_IDP_SIGNING_KEY:}
# Resources (RFC 8707) clients may request tokens for, the token audience is the resource
vacantagent.auth.allowed-resources=${vacantagent.mcp.resource-uri}
# MCP clients identified by a Client ID Metadata Document (CIMD), see Docs/authentication.md. Only clients on the
# allowlist: exact client_id URLs, or prefixes ending with "/".
vacantagent.auth.cimd.enabled=true
vacantagent.auth.cimd.allowed-client-ids=https://claude.ai/oauth/mcp-oauth-client-metadata,\
  https://claude.ai/oauth/claude-code-client-metadata,\
  https://chatgpt.com/oauth/,\
  https://vscode.dev/oauth/client-metadata.json
vacantagent.auth.cimd.scopes=mcp:read,mcp:write
# Clients with only loopback or private-use scheme redirect URIs (Claude Code, VS Code): any local program can pose as
# them, so read access only
vacantagent.auth.cimd.native-scopes=mcp:read
vacantagent.auth.cimd.fetch-timeout=3s
vacantagent.auth.cimd.max-document-size=5120
vacantagent.auth.cimd.max-fetches-per-minute=10
vacantagent.auth.cimd.cache-min-ttl=5m
vacantagent.auth.cimd.cache-max-ttl=24h
vacantagent.auth.cimd.cache-default-ttl=1h
vacantagent.auth.cimd.stale-grace=24h
vacantagent.auth.cimd.access-token-ttl=15m
vacantagent.auth.cimd.refresh-token-ttl=30d

# Monetary values and currency conversion, see Docs/money.md. The base currency is fixed in Money.BASE_CURRENCY.
vacantagent.money.currencies=USD,EUR,GBP,CHF
vacantagent.money.exchange-rates.ecb-url=https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
vacantagent.money.exchange-rates.update-enabled=true
vacantagent.money.exchange-rates.update-cron=0 0 17 * * MON-FRI
# Older rates are still used for display, but rejected for conversions with booking effect
vacantagent.money.exchange-rates.max-age-days=4

# PayPal (module com.vacantagent.paypal), see Docs/paypal.md. Never commit credentials: set the environment variables
# PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET (Docker secrets in the stack, see Docs/deployment.md), or put them into the
# git-ignored backend/config/application-local.properties and start with the profile "local".
# Without them the app starts, but linking, top-ups and payouts answer 503.
vacantagent.paypal.environment=${PAYPAL_ENVIRONMENT:sandbox}
vacantagent.paypal.client-id=${PAYPAL_CLIENT_ID:}
vacantagent.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
# Must be registered as return URL of "Log in with PayPal" in the PayPal app settings
vacantagent.paypal.connect-redirect-uri=${vacantagent.frontend-url}/paypal/connected
vacantagent.paypal.checkout-return-url=${vacantagent.frontend-url}/consumer/guthaben/paypal
vacantagent.paypal.checkout-cancel-url=${vacantagent.frontend-url}/consumer/guthaben/paypal?abgebrochen=1
vacantagent.paypal.brand-name=VacantAgent
vacantagent.paypal.timeout=20s

# Accounting (module com.vacantagent.accounting), see Docs/accounting.md. Amounts in the base currency USD.
vacantagent.accounting.min-top-up=5.00
vacantagent.accounting.max-top-up=1000.00
vacantagent.accounting.min-payout=10.00
vacantagent.accounting.link-state-ttl=15m
vacantagent.accounting.status-check-enabled=true
vacantagent.accounting.status-check-interval=5m

# Deterministic, readable OpenAPI output, frontend/openapi.json is committed and diffed in CI
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Swagger UI login via the auth module, see OpenApiConfig
springdoc.swagger-ui.oauth.client-id=vacantagent-swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# MCP server for agents at /mcp, no tools yet. OAuth protected resource: tokens need the audience resource-uri and
# scope mcp:read, tools other than vacantagent.mcp.read-tools (comma-separated, none yet) also mcp:write.
vacantagent.mcp.resource-uri=${vacantagent.backend-url}/mcp
spring.ai.mcp.server.name=vacantagent
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
