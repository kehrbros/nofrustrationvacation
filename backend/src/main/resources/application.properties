# Docker secrets (files in /run/secrets, e.g. PAYPAL_CLIENT_ID) become properties named like the file and resolve the
# placeholders below, see Docs/deployment.md. Optional, locally environment variables are used.
spring.config.import=optional:configtree:/run/secrets/

# Public URLs as seen by the browser, used for issuer, redirect URIs, CORS and PayPal return URLs
nfv.backend-url=${NFV_BACKEND_URL:http://localhost:8080}
nfv.frontend-url=${NFV_FRONTEND_URL:http://localhost:5173}

# PostgreSQL with PostGIS (Docker stack, docker-compose.local.yml, tests via Testcontainers), see Docs/deployment.md.
# The password comes from the Docker secret /run/secrets/POSTGRES_PASSWORD (configtree) or the environment.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nfv}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:nfv}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.revision_field_name=rev
spring.jpa.properties.hibernate.envers.revision_type_field_name=revtype

# Road network and routing (module com.nfv.network), see Docs/network.md#konfiguration. The extract is copied by hand
# to ~/data/osm on each host (not in Git), the Geofabrik download follows. Docker mounts ~/data to /data (NFV_DATA_DIR).
# Without the file the app starts, the import fails and routing answers 503.
nfv.network.import-on-start=${NFV_NETWORK_IMPORT_ON_START:true}
nfv.network.regions.nz.osm-file=${NFV_DATA_DIR:${user.home}/data}/osm/new-zealand-latest.osm.pbf
nfv.network.regions.nz.graph-dir=${NFV_DATA_DIR:${user.home}/data}/graphs/nz
# MMAP: graph outside the heap
nfv.network.regions.nz.data-access=MMAP
nfv.network.regions.nz.driving-side=LEFT
# North and South Island are connected by ferry only
nfv.network.regions.nz.ferries=true

# Resource server (API), see Docs/authentication.md. For Keycloak: issuer-uri=https://<host>/realms/<realm>,
# username-claim=preferred_username, roles-claim=realm_access.roles
spring.security.oauth2.resourceserver.jwt.issuer-uri=${nfv.backend-url}
nfv.security.username-claim=sub
nfv.security.roles-claim=roles

# Auth module (own identity provider, package com.nfv.auth). Remove when switching to an external IdP.
spring.security.oauth2.authorizationserver.issuer=${nfv.backend-url}
spring.security.oauth2.authorizationserver.client.nfv-frontend.registration.client-id=nfv-frontend
spring.security.oauth2.authorizationserver.client.nfv-frontend.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.nfv-frontend.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.nfv-frontend.registration.redirect-uris=${nfv.frontend-url}/auth/callback,${nfv.backend-url}/swagger-ui/oauth2-redirect.html
spring.security.oauth2.authorizationserver.client.nfv-frontend.registration.post-logout-redirect-uris=${nfv.frontend-url}/
spring.security.oauth2.authorizationserver.client.nfv-frontend.registration.scopes=openid,profile,email
spring.security.oauth2.authorizationserver.client.nfv-frontend.require-proof-key=true
spring.security.oauth2.authorizationserver.client.nfv-frontend.require-authorization-consent=false
nfv.auth.cors.allowed-origins=${nfv.frontend-url}
# Creates the account test/test on startup if no account exists
nfv.auth.test-account.enabled=true
# Key signing the tokens: PEM encoded PKCS#8 RSA private key (Docker secret NFV_IDP_SIGNING_KEY, see
# Docs/deployment.md). Without it a temporary key is used, all tokens become invalid on restart.
nfv.auth.signing-key=${NFV_IDP_SIGNING_KEY:}
# Resources (RFC 8707) clients may request tokens for, the token audience is the resource
nfv.auth.allowed-resources=${nfv.mcp.resource-uri}
# MCP clients identified by a Client ID Metadata Document (CIMD), see Docs/authentication.md. Only clients on the
# allowlist: exact client_id URLs, or prefixes ending with "/".
nfv.auth.cimd.enabled=true
nfv.auth.cimd.allowed-client-ids=https://claude.ai/oauth/mcp-oauth-client-metadata,\
  https://claude.ai/oauth/claude-code-client-metadata,\
  https://chatgpt.com/oauth/,\
  https://vscode.dev/oauth/client-metadata.json
nfv.auth.cimd.scopes=mcp:read,mcp:write
# Clients with only loopback or private-use scheme redirect URIs (Claude Code, VS Code): any local program can pose as
# them, so read access only
nfv.auth.cimd.native-scopes=mcp:read
nfv.auth.cimd.fetch-timeout=3s
nfv.auth.cimd.max-document-size=5120
nfv.auth.cimd.max-fetches-per-minute=10
nfv.auth.cimd.cache-min-ttl=5m
nfv.auth.cimd.cache-max-ttl=24h
nfv.auth.cimd.cache-default-ttl=1h
nfv.auth.cimd.stale-grace=24h
nfv.auth.cimd.access-token-ttl=15m
nfv.auth.cimd.refresh-token-ttl=30d

# Monetary values and currency conversion, see Docs/money.md. The base currency is fixed in Money.BASE_CURRENCY.
nfv.money.currencies=USD,EUR,GBP,CHF
nfv.money.exchange-rates.ecb-url=https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
nfv.money.exchange-rates.update-enabled=true
nfv.money.exchange-rates.update-cron=0 0 17 * * MON-FRI
# Older rates are still used for display, but rejected for conversions with booking effect
nfv.money.exchange-rates.max-age-days=4

# PayPal (module com.nfv.paypal), see Docs/paypal.md. Never commit credentials: set the environment variables
# PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET (Docker secrets in the stack, see Docs/deployment.md), or put them into the
# git-ignored backend/config/application-local.properties and start with the profile "local".
# Without them the app starts, but linking, top-ups and payouts answer 503.
nfv.paypal.environment=${PAYPAL_ENVIRONMENT:sandbox}
nfv.paypal.client-id=${PAYPAL_CLIENT_ID:}
nfv.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
# Must be registered as return URL of "Log in with PayPal" in the PayPal app settings
nfv.paypal.connect-redirect-uri=${nfv.frontend-url}/paypal/connected
nfv.paypal.checkout-return-url=${nfv.frontend-url}/consumer/guthaben/paypal
nfv.paypal.checkout-cancel-url=${nfv.frontend-url}/consumer/guthaben/paypal?abgebrochen=1
nfv.paypal.brand-name=Nfv
nfv.paypal.timeout=20s

# Accounting (module com.nfv.accounting), see Docs/accounting.md. Amounts in the base currency USD.
nfv.accounting.min-top-up=5.00
nfv.accounting.max-top-up=1000.00
nfv.accounting.min-payout=10.00
nfv.accounting.link-state-ttl=15m
nfv.accounting.status-check-enabled=true
nfv.accounting.status-check-interval=5m

# Deterministic, readable OpenAPI output, frontend/openapi.json is committed and diffed in CI
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Swagger UI login via the auth module, see OpenApiConfig
springdoc.swagger-ui.oauth.client-id=nfv-frontend
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# MCP server for agents at /mcp, tools in trips.api.TripTools. OAuth protected resource: tokens need the audience
# resource-uri and scope mcp:read, tools other than nfv.mcp.read-tools (comma-separated) also mcp:write.
nfv.mcp.resource-uri=${nfv.backend-url}/mcp
nfv.mcp.read-tools=list_trips,get_trip,get_route
spring.ai.mcp.server.name=nfv
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# Title photos of trips and booking confirmations (5 MB, see TripLogic.MAX_COVER_IMAGE_BYTES, AccommodationExtractor)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Keep the offset a client sends with a point in time (Jackson adjusts to UTC by default), see Docs/architecture.md
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false

# Assistant (module com.nfv.assistant): reads booking confirmations and draws title photos via the OpenAI API, see
# Docs/architecture.md#assistant. Without a key, bookings can only be entered manually. Never commit the key: set the
# environment variable OPENAI_API_KEY (Docker secret in the stack, see Docs/deployment.md).
nfv.assistant.api-key=${OPENAI_API_KEY:}
nfv.assistant.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
nfv.assistant.model=${OPENAI_MODEL:gpt-5-mini}
nfv.assistant.image-model=${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
nfv.assistant.image-quality=low
nfv.assistant.timeout=90s
nfv.assistant.requests-per-hour=30
