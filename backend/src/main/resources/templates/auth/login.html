<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:replace="~{auth/layout :: head('Anmelden')}"></head>
<body>
<header th:replace="~{auth/layout :: hero('Deine Reisen im Blick. Störungen, bevor sie dich treffen.')}"></header>
<main class="va-sheet">
    <div class="va-sheet-inner">
        <h1 class="va-title">Anmelden</h1>
        <p class="va-note" th:if="${param.registered}">Registrierung erfolgreich. Bitte melde dich an.</p>
        <p class="va-note va-note-error" th:if="${param.error}" role="alert">Benutzername oder Passwort ist falsch.</p>
        <p class="va-note" th:if="${param.logout}">Du wurdest abgemeldet.</p>
        <p class="va-note" th:if="${param.expired}" role="status">Die Anmeldeseite war zu lange geöffnet. Bitte melde dich noch einmal an.</p>
        <form class="va-form" th:action="@{/login}" method="post">
            <label class="va-field">Benutzername
                <input class="va-input" type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
            </label>
            <label class="va-field">Passwort
                <input class="va-input" type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="va-btn va-btn-primary" type="submit">Anmelden</button>
        </form>
        <p class="va-switch">Noch kein Konto? <a th:href="@{/register}">Registrieren</a></p>
    </div>
</main>
</body>
</html>
