<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>VacantAgent – Sign in</title>
</head>
<body>
<h1>Sign in</h1>
<p th:if="${param.registered}">Registration successful, please sign in.</p>
<p th:if="${param.error}">Invalid username or password.</p>
<p th:if="${param.logout}">You have been signed out.</p>
<form th:action="@{/login}" method="post">
    <label>Username <input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
</form>
<p><a th:href="@{/register}">Create an account</a></p>
</body>
</html>
