<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:replace="~{auth/layout :: head('Registrieren')}"></head>
<body>
<header th:replace="~{auth/layout :: hero('Leg dein Konto an und plane deine erste Reise.')}"></header>
<main class="va-sheet">
    <div class="va-sheet-inner">
        <h1 class="va-title">Konto erstellen</h1>
        <p class="va-note va-note-error" th:if="${error}" th:text="${error}" role="alert"></p>
        <p class="va-note" th:if="${param.expired}" role="status">Die Seite war zu lange geöffnet. Bitte gib deine Daten noch einmal ein.</p>
        <form class="va-form" th:action="@{/register}" method="post">
            <label class="va-field">Benutzername
                <input class="va-input" type="text" name="username" th:value="${username}" autocomplete="username" autocapitalize="none" required autofocus>
                <small>3 bis 64 Zeichen: Buchstaben, Ziffern, Punkt, Unterstrich oder Bindestrich.</small>
            </label>
            <label class="va-field"><span>E-Mail <small>(optional)</small></span>
                <input class="va-input" type="email" name="email" th:value="${email}" autocomplete="email">
            </label>
            <label class="va-field">Passwort
                <input class="va-input" type="password" name="password" autocomplete="new-password" required minlength="8">
                <small>Mindestens 8 Zeichen.</small>
            </label>
            <button class="va-btn va-btn-primary" type="submit">Registrieren</button>
        </form>
        <p class="va-switch">Schon ein Konto? <a th:href="@{/login}">Anmelden</a></p>
    </div>
</main>
</body>
</html>
