<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:replace="~{auth/layout :: head('Verbindungen')}"></head>
<body>
<header th:replace="~{auth/layout :: hero('Verbundene Anwendungen')}"></header>
<main class="va-sheet">
    <div class="va-sheet-inner">
        <h1 class="va-title">Verbindungen</h1>
        <p class="va-text">Anwendungen wie Claude oder ChatGPT, die per MCP auf das Konto <strong th:text="${username}">user</strong> zugreifen.</p>
        <p class="va-note" th:if="${param.revoked}">Zugriff widerrufen. Die Anwendung muss erneut um Zugriff bitten.</p>
        <p class="va-text" th:if="${connections.isEmpty()}">Keine verbundenen Anwendungen.</p>
        <ul class="va-cards" th:unless="${connections.isEmpty()}">
            <li class="va-card" th:each="view : ${connections}">
                <div class="va-card-head">
                    <div>
                        <p class="va-card-title" th:text="${view.connection.clientName}">Claude</p>
                        <p class="va-card-sub" th:text="${view.connection.clientId}">https://claude.ai/...</p>
                    </div>
                    <form th:action="@{/account/connections/revoke}" method="post">
                        <input type="hidden" name="id" th:value="${view.connection.registeredClientId}">
                        <button class="va-btn va-btn-small" type="submit">Widerrufen</button>
                    </form>
                </div>
                <ul class="va-chips">
                    <li class="va-chip" th:each="scope : ${view.scopes}" th:text="${scope.description}">Deine Daten lesen</li>
                </ul>
                <p class="va-card-sub" th:if="${!#strings.isEmpty(view.lastIssuedAt)}" th:text="|Zuletzt genutzt: ${view.lastIssuedAt}|">Zuletzt genutzt: 28.10.2026 12:00 UTC</p>
            </li>
        </ul>
        <form class="va-form" th:action="@{/logout}" method="post">
            <button class="va-btn" type="submit">Abmelden</button>
        </form>
    </div>
</main>
</body>
</html>
