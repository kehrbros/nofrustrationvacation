# PostgreSQL instead of the in-memory H2 (Docker stack, see Docs/deployment.md). Activate with the profile "postgres".
# The password comes from the Docker secret /run/secrets/POSTGRES_PASSWORD (configtree) or the environment.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vacantagent}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:vacantagent}
spring.datasource.password=${POSTGRES_PASSWORD}
