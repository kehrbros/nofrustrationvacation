# Local run of Nfv with PostgreSQL. All images are built from the Dockerfiles in this repo, no access to
# the container registry and no local Java, Maven or Node needed, see Docs/deployment.md.
#
#   docker compose -f docker-compose.local.yml up --build
#
# Frontend http://localhost:18173 (port of the Vite dev server, so the registered redirect URIs and the PayPal
# return URL fit), backend http://localhost:18180 (uncommon ports so that other projects can keep 5173 and 8080, LOCAL_FRONTEND_PORT and
# LOCAL_BACKEND_PORT in .env change them), login test/test. Reset the database with "down -v".
# For the PayPal sandbox, which rejects localhost as return URL, tunnel the frontend with ngrok (ngrok http 18173), set
# LOCAL_FRONTEND_URL to the ngrok URL in .env and open the frontend there, see Docs/paypal.md.
# Secrets come from the git-ignored .env (copy .env.example): database password required, PayPal, IdP signing key
# and OpenAI API key optional.

name: nfv-local

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: nfv
      POSTGRES_USER: nfv
      # From .env, the stack uses the Docker secret nfv_postgres_password instead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfv -d nfv"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: nfv-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nfv
      POSTGRES_USER: nfv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      NFV_BACKEND_URL: http://localhost:${LOCAL_BACKEND_PORT:-18180}
      NFV_FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:${LOCAL_FRONTEND_PORT:-18173}}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      # Empty: the app starts, PayPal features answer 503
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      NFV_IDP_SIGNING_KEY: ${NFV_IDP_SIGNING_KEY:-}
      # Empty: booking confirmations are not read automatically, manual input only
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Empty: no search for alternative accommodations (LiteAPI, sandbox keys start with sand_)
      LITEAPI_API_KEY: ${LITEAPI_API_KEY:-}
      # Test endpoints /api/v1/test/traffic-events, see Docs/traffic-feed.md#test-source-manual
      NFV_MANUAL_SOURCE_ENABLED: ${NFV_MANUAL_SOURCE_ENABLED:-false}
      # Road network data mounted below, see Docs/network.md#configuration
      NFV_DATA_DIR: /data
      NFV_NETWORK_IMPORT_ON_START: ${NFV_NETWORK_IMPORT_ON_START:-true}
    volumes:
      # OSM extract copied by hand to the host (not in Git), read only
      - ${NFV_HOST_DATA_DIR:-${HOME}/data}/osm:/data/osm:ro
      # GraphHopper graph built on the first start, kept between container rebuilds
      - ${NFV_HOST_DATA_DIR:-${HOME}/data}/graphs:/data/graphs
    ports:
      - "${LOCAL_BACKEND_PORT:-18180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nfv-frontend:local
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: http://localhost:${LOCAL_BACKEND_PORT:-18180}
    environment:
      # Requests under another origin (e.g. http://localhost:18173 with LOCAL_FRONTEND_URL set) are redirected there,
      # the backend accepts only this origin for CORS and the OIDC redirect URI, see frontend/nginx.conf
      CANONICAL_FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:${LOCAL_FRONTEND_PORT:-18173}}
    ports:
      - "${LOCAL_FRONTEND_PORT:-18173}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
