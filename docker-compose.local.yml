# Local run of Nfv with PostgreSQL. All images are built from the Dockerfiles in this repo, no access to
# the container registry and no local Java, Maven or Node needed, see Docs/deployment.md.
#
#   docker compose -f docker-compose.local.yml up --build
#
# Frontend http://localhost:5173 (port of the Vite dev server, so the registered redirect URIs and the PayPal
# return URL fit), backend http://localhost:8080, login test/test. Reset the database with "down -v".
# For the PayPal sandbox, which rejects localhost as return URL, set LOCAL_FRONTEND_URL=https://localtest.me:5443 in
# .env and open the frontend there (HTTPS with a self-signed certificate, accept the browser warning once), see
# Docs/paypal.md.
# Secrets come from the git-ignored .env (copy .env.example): database password required, PayPal and encryption
# key optional.

name: nfv-local

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: nfv
      POSTGRES_USER: nfv
      # From .env, the stack uses the Docker secret nfv_postgres_password instead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfv -d nfv"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: nfv-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nfv
      POSTGRES_USER: nfv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      NFV_BACKEND_URL: http://localhost:8080
      NFV_FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:5173}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      # Empty: the app starts, PayPal features answer 503
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      NFV_IDP_SIGNING_KEY: ${NFV_IDP_SIGNING_KEY:-}
      # Empty: booking confirmations are not read automatically, manual input only
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Creates a self-signed certificate for localhost and localtest.me once (kept in the volume local-cert)
  local-cert:
    image: alpine:3.20
    command:
      - sh
      - -c
      - >-
        test -f /certs/local.crt ||
        (apk add --no-cache openssl >/dev/null &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj /CN=localtest.me
        -addext subjectAltName=DNS:localtest.me,DNS:localhost,IP:127.0.0.1
        -keyout /certs/local.key -out /certs/local.crt)
    volumes:
      - local-cert:/certs

  frontend:
    image: nfv-frontend:local
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8080
    environment:
      # Requests under another origin (e.g. http://localhost:5173 with LOCAL_FRONTEND_URL set) are redirected there,
      # the backend accepts only this origin for CORS and the OIDC redirect URI, see frontend/nginx.conf
      CANONICAL_FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5173:80"
      # HTTPS, for a frontend host other than localhost (LOCAL_FRONTEND_URL)
      - "5443:443"
    volumes:
      - ./frontend/nginx.local-tls.conf:/etc/nginx/templates/local-tls.conf.template:ro
      - local-cert:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      local-cert:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  local-cert:
