# Local HTTPS for docker-compose.local.yml only (not in the image): needed for a frontend host other than localhost,
# e.g. https://localtest.me:5443 for the PayPal sandbox. Browsers treat plain http on such hosts as insecure, then the
# login fails (PKCE needs crypto.subtle). Certificate: self-signed, created by the service local-cert.
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream ${BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
