# Scheme as seen by the browser, behind a TLS terminating tunnel (ngrok) the request reaches nginx as http
map $http_x_forwarded_proto $browser_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Optional redirect to the frontend URL the backend knows (CORS origin, OIDC redirect URI), set by
# docker-compose.local.yml only: a request under another origin, e.g. http://localhost:5173 while LOCAL_FRONTEND_URL is
# an ngrok URL, would otherwise fail at the login with a CORS error. Empty (default): no redirect.
map "${CANONICAL_FRONTEND_URL}|$browser_scheme://$http_host" $canonical_frontend_redirect {
    default "";
    "~^(?<canonical>[^|]+)\|(?!\k<canonical>$)" $canonical;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, resolves the backend per request so nginx starts without it and follows service updates
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same origin API like the Vite dev proxy, BACKEND_UPSTREAM is replaced on container start
    location /api/ {
        set $backend_upstream ${BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # service worker and manifest of the installable app: always revalidate, so updates arrive
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        if ($canonical_frontend_redirect) {
            return 302 $canonical_frontend_redirect$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
