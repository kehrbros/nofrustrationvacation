server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, resolves the backend per request so nginx starts without it and follows service updates
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same origin API like the Vite dev proxy, BACKEND_UPSTREAM is replaced on container start
    location /api/ {
        set $backend_upstream ${BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
