name: Deploy

# Deploys the Swarm stack "nfv" over SSH, see Docs/deployment.md#continuous-deployment.
# Called by "Build and deploy" after the images are verified; manually it redeploys the
# images of the selected main commit (they must have been built before).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: nfv-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only main deploys, whether called by "Build and deploy" or run manually.
    if: github.ref == 'refs/heads/main'
    environment: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check images of this commit
        run: |
          set -euo pipefail
          for image in backend frontend caddy; do
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}/${image}:sha-${GITHUB_SHA}" > /dev/null \
              || { echo "::error::Image ${image}:sha-${GITHUB_SHA} missing, run 'Build and deploy' first"; exit 1; }
          done

      - name: Deploy stack over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

          # Docker compose vars, see section "Swarm stack" in .env.example
          DOMAIN: ${{ vars.DOMAIN }}
          NFV_HOST_DATA_DIR: ${{ vars.NFV_HOST_DATA_DIR }}
          PAYPAL_ENVIRONMENT: ${{ vars.PAYPAL_ENVIRONMENT }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"
          : "${DOMAIN:?Missing DOMAIN variable}"
          [[ "$DOMAIN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo 'DOMAIN must be a plain host name like app.example.org'; exit 1; }
          : "${NFV_HOST_DATA_DIR:?Missing NFV_HOST_DATA_DIR variable}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid SSH port'; exit 1; }
          test -f docker-compose.yml
          docker --version

          # Pin the images of this commit, a rollback is a manual run on an older commit.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          export BACKEND_IMAGE="$image/backend:sha-$GITHUB_SHA" FRONTEND_IMAGE="$image/frontend:sha-$GITHUB_SHA"
          export CADDY_IMAGE="$image/caddy:sha-$GITHUB_SHA"
          export STACK_NAME=nfv

          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/nfv-ssh.XXXXXX")"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          # Render first so a config error cannot start a remote deployment.
          docker stack config -c docker-compose.yml > "$ssh_dir/stack.yml"

          # The server only allows "deploy-stack STACK_NAME" for this key (deploy/setup-deploy-user.sh),
          # the rendered stack is passed on stdin.
          ssh -F /dev/null -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$ssh_dir/key" \
            -p "$DEPLOY_PORT" \
            -l "$DEPLOY_USER" \
            "$DEPLOY_HOST" \
            "deploy-stack $STACK_NAME" \
            < "$ssh_dir/stack.yml"
