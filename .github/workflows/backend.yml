name: Backend

# main is tested by "Build and deploy" (build.yml), which calls this workflow before building the images.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and generate OpenAPI spec
        run: mvn -B verify
      - name: Check committed OpenAPI spec
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- frontend/openapi.json)" ]; then
            git diff -- frontend/openapi.json
            echo "::error file=frontend/openapi.json::OpenAPI spec is outdated. Run 'mvn verify' in backend/ and commit frontend/openapi.json."
            exit 1
          fi
