name: Build and deploy

# Every push to main (i.e. every merge) is tested, built into images and deployed to the server,
# see Docs/deployment.md#continuous-deployment. Other branches and pull requests only run the tests
# (Backend / Frontend workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nfv-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend tests
    uses: ./.github/workflows/backend.yml

  frontend-tests:
    name: Frontend tests
    uses: ./.github/workflows/frontend.yml

  backend:
    name: Backend image
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build backend jar
        working-directory: backend
        run: mvn -B -DskipTests verify
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      # The server is ARM (aarch64), images are built for both architectures
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  frontend:
    name: Frontend image
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/frontend" >> "$GITHUB_OUTPUT"
      # The server is ARM (aarch64), images are built for both architectures
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          # Vite inlines the OIDC authority at build time: the IdP of the backend under the origin of
          # the page (Caddy routes by path), so the image does not depend on the domain.
          build-args: |
            VITE_OIDC_AUTHORITY=same-origin

  caddy:
    name: Caddy image
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/caddy" >> "$GITHUB_OUTPUT"
      # The server is ARM (aarch64), images are built for both architectures
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./deploy/caddy
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  verify:
    name: Verify published images
    needs: [backend, frontend, caddy]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check all stack images and commit tags
        run: |
          set -euo pipefail
          for image in backend frontend caddy; do
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}/${image}:main" > /dev/null
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}/${image}:sha-${GITHUB_SHA}" > /dev/null
          done

  # Called instead of triggered via workflow_run, so the run keeps main as github.ref and the
  # commit of this build (a workflow_run run would use the head of the default branch).
  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
